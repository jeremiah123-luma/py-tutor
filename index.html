    <style>
      /* Start-up screen ("assemble", after Aristide Benoist's WebGPU type studies): ">_ py-tutor" builds itself from slices
         that fly in on curves, with red and blue fringes (about 1.2 s). It is painted
         with the first byte of HTML and run by the script below, before the app's code loads; src/ui/splash.ts lifts it. */
      html, body { background: #111111; margin: 0; }
      #splash { position: fixed; inset: 0; z-index: 1000; overflow: hidden; display: grid; place-items: center; color: #F5F5F5; -webkit-user-select: none; user-select: none; pointer-events: none; }
      #splash .bg { position: absolute; inset: 0; background: #111111; }
      #splash .center { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; }
      #splash .aword { position: relative; display: flex; font: 900 min(60px, 14.5vw)/1 system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: -0.03em; white-space: nowrap; }
      #splash .g { position: relative; display: inline-block; }
      #splash .g.sp { width: 0.32em; }
      #splash .sz { visibility: hidden; }
      #splash .sl { position: absolute; left: -0.2em; top: -0.3em; padding: 0.3em 0.2em; }
      /* once a letter's pieces land it's drawn whole: no seams between strips, nothing cropped */
      #splash .g.done .sz { visibility: visible; }
      #splash .g.done .sl { visibility: hidden; }
      #splash .g.y .sz { color: #FFE27A; }
      #splash .sl.r { color: #FF3355; }
      #splash .sl.b { color: #3D7BFF; }
      #splash .sl.w { color: #F5F5F5; }
      #splash .g.y .sl.w { color: #FFE27A; }
      #splash .sp-sub { position: relative; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; color: #8C8C8C; letter-spacing: 0.01em; }
      #splash .sp-sub b { color: #A8A8A8; font-weight: 500; }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Opening py-tutor">
      <div class="bg"></div>
      <div class="center" aria-hidden="true">
        <div class="aword" data-text=">_ py-tutor"></div>
        <div class="sp-sub">CS 100 final · <b>Dec 19</b></div>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('splash');
        // once per visit: a reload or a second tab goes straight in
        try {
          if (sessionStorage.getItem('py-tutor.splash') === '1' && !/[?&]splash\b/.test(location.search)) { el.remove(); return; }
          sessionStorage.setItem('py-tutor.splash', '1');
        } catch (e) {}
        window.__splashAt = performance.now();
        var reduce = false;
        try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
        // Everything animated here is transform or opacity only, which phones run on the graphics chip: it stays
        // smooth even while the app's own code is loading at the same moment.
        var word = el.querySelector('.aword');
        var text = word.getAttribute('data-text');
        var seed = 7;
        var rnd = function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
        var K = 3; // slices per letter
        var GAP = 0.045; // seconds between letters
        var slices = [];
        var frag = document.createDocumentFragment();
        text.split('').forEach(function (ch, gi) {
          var g = document.createElement('span');
          g.className = 'g' + (ch === '_' ? ' y' : '') + (ch === ' ' ? ' sp' : '');
          var size = document.createElement('span');
          size.className = 'sz';
          size.textContent = ch === ' ' ? ' ' : ch;
          g.appendChild(size);
          if (ch !== ' ') {
            for (var s = 0; s < K; s++) {
              ['r', 'b', 'w'].forEach(function (col) {
                var sl = document.createElement('span');
                sl.className = 'sl ' + col;
                sl.textContent = ch;
                // Each strip's box is padded past the line (Safari won't clip outside an element's own box), so the
                // outer strips keep the tails of p and y and the tops of tall letters; inner edges overlap so no seam shows.
                var PAD = 0.3, H = 1 + 2 * PAD, OV = 0.03;
                var top = s === 0 ? 0 : ((PAD + s / K - OV) / H) * 100, bot = s === K - 1 ? 0 : ((PAD + (K - 1 - s) / K - OV) / H) * 100;
                sl.style.clipPath = 'inset(' + top.toFixed(2) + '% 0 ' + bot.toFixed(2) + '% 0)';
                g.appendChild(sl);
                slices.push({ el: sl, gi: gi, s: s, col: col });
              });
            }
          }
          frag.appendChild(g);
        });
        word.appendChild(frag);
        // one random path per slice, shared by its three colour copies
        var paths = {};
        slices.forEach(function (o) {
          var key = o.gi + ':' + o.s;
          if (!paths[key]) {
            paths[key] = {
              dx: 120 + rnd() * 220,
              dy: (o.s - 1) * (22 + rnd() * 34) + (rnd() - 0.5) * 40,
              r: (rnd() - 0.5) * 50,
              sx: 0.15 + rnd() * 0.3,
              d: 0.06 + o.gi * GAP + o.s * 0.025 + rnd() * 0.05,
            };
          }
          var p = paths[key];
          var lag = o.col === 'w' ? 0 : o.col === 'r' ? 0.03 : 0.055;
          if (reduce) return;
          var a = o.el.animate(
            [
              { transform: 'translate(' + p.dx + 'px,' + p.dy + 'px) rotate(' + p.r + 'deg) scaleX(' + p.sx + ')', opacity: 0, offset: 0 },
              { opacity: 1, offset: 0.25 },
              { transform: 'translate(' + p.dx * 0.18 + 'px,' + p.dy * 0.05 + 'px) rotate(' + p.r * 0.1 + 'deg) scaleX(1.06)', offset: 0.7 },
              { transform: 'none', opacity: 1, offset: 1 },
            ],
            { duration: 560, delay: (p.d + lag) * 1000, easing: 'cubic-bezier(.2,.75,.25,1)', fill: 'backwards' },
          );
          var g = o.el.parentNode;
          g.pending = (g.pending || 0) + 1;
          a.onfinish = function () { if (--g.pending === 0) g.classList.add('done'); };
        });
        if (reduce) word.querySelectorAll('.g').forEach(function (g) { g.classList.add('done'); });
        el.querySelector('.sp-sub').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: reduce ? 0 : 880, fill: 'backwards' });
        window.__splashExit = function () {
          word.querySelectorAll('.g').forEach(function (g) { g.classList.remove('done'); }); // back to pieces to fly off
          slices.forEach(function (o) {
            var p = paths[o.gi + ':' + o.s];
            var lag = o.col === 'w' ? 0 : o.col === 'r' ? 0.025 : 0.05;
            o.el.animate(
              [{ transform: 'none', opacity: 1 }, { transform: 'translate(' + -p.dx * 1.2 + 'px,' + -p.dy * 0.6 + 'px) rotate(' + -p.r + 'deg) scaleX(' + p.sx + ')', opacity: 0 }],
              { duration: 380, delay: ((text.length - o.gi) * 0.022 + o.s * 0.012 + lag) * 1000, easing: 'cubic-bezier(.6,0,.8,.3)', fill: 'forwards' },
            );
          });
          el.querySelector('.sp-sub').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' });
          el.querySelector('.bg').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 320, delay: 300, easing: 'ease-in', fill: 'forwards' });
          return 650;
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
