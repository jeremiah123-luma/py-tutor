    <style>
      /* Start-up screen, painted with the first byte of HTML before any script loads; src/ui/splash.ts lifts it.
         Three versions (data-v): draw (the mark draws itself, the name types in), zoom (Command Center's "zoom
         through": the big mark rests, then you fly into the opening of the >), caret (a cursor types the name,
         stretches into a line, and the screen splits open along it). Also wink (after Hey: a face winks and becomes the >_), haze (after Brain Fog Haze: the
         word comes out of a blur) assemble (after WebGPU Type: letters built from flying slices) and morph (after WebGPU
         Morphing Engine: { } -> 19 -> >_ melting into each other); these four run the script below. Pick one with ?splash=<name>. */
      html, body { background: #111111; margin: 0; }
      #splash { position: fixed; inset: 0; z-index: 1000; overflow: hidden; color: #F5F5F5; -webkit-user-select: none; user-select: none; pointer-events: none; }
      #splash > div { position: absolute; inset: 0; display: none; place-items: center; }
      #splash[data-v="draw"] .v-draw, #splash[data-v="zoom"] .v-zoom, #splash[data-v="caret"] .v-caret,
      #splash[data-v="wink"] .v-wink, #splash[data-v="haze"] .v-haze, #splash[data-v="assemble"] .v-assemble,
      #splash[data-v="morph"] .v-morph { display: grid; }
      .sp-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; color: #8C8C8C; letter-spacing: 0.01em; }
      .sp-sub b { color: #A8A8A8; font-weight: 500; }
      @keyframes sp-fade { to { opacity: 1; } }

      /* ---- draw ---- */
      .v-draw { background: #111111; transition: opacity 420ms cubic-bezier(0.16, 1, 0.3, 1), transform 520ms cubic-bezier(0.16, 1, 0.3, 1), filter 420ms ease; }
      #splash.out .v-draw { opacity: 0; transform: scale(1.06); filter: blur(6px); }
      .v-draw .glow { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(60px); opacity: 0; animation: sp-glow 1.4s 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards, sp-drift 9s 0.15s ease-in-out infinite alternate; }
      .v-draw .g1 { background: radial-gradient(closest-side, #A78BFA, transparent); left: -30vmax; top: -34vmax; }
      .v-draw .g2 { background: radial-gradient(closest-side, #F9A8D4, transparent); right: -36vmax; bottom: -38vmax; animation-delay: 0.3s, 0.3s; }
      .v-draw .g3 { background: radial-gradient(closest-side, #93C5FD, transparent); right: -40vmax; top: -30vmax; width: 50vmax; height: 50vmax; animation-delay: 0.45s, 0.45s; }
      .v-draw .center { position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px; }
      .v-draw svg { width: 112px; height: 67px; overflow: visible; }
      .v-draw .up, .v-draw .down { transform-box: fill-box; transform-origin: 100% 50%; }
      .v-draw .up { animation: sp-bar 0.45s cubic-bezier(0.16, 1, 0.3, 1) both, sp-up 0.6s 0.4s cubic-bezier(0.34, 1.4, 0.5, 1) forwards; }
      .v-draw .down { animation: sp-bar 0.45s cubic-bezier(0.16, 1, 0.3, 1) both, sp-down 0.6s 0.42s cubic-bezier(0.34, 1.4, 0.5, 1) forwards; }
      .v-draw .tip { opacity: 0; animation: sp-fade 0.2s 0.82s ease forwards; }
      .v-draw .us { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); animation: sp-us 0.4s 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards, sp-blink 1.06s 1.6s steps(1) infinite; }
      .v-draw .word { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.045em; line-height: 1; white-space: nowrap; }
      .v-draw .word i { font-style: normal; display: inline-block; opacity: 0; transform: translateY(6px); animation: sp-letter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .v-draw .sp-sub { opacity: 0; animation: sp-fade 0.6s 1.25s ease forwards; }
      @keyframes sp-bar { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
      @keyframes sp-up { from { transform: rotate(0); } to { transform: rotate(-32deg); } }
      @keyframes sp-down { from { transform: rotate(0); } to { transform: rotate(32deg); } }
      @keyframes sp-us { to { transform: scaleX(1); } }
      @keyframes sp-blink { 50% { opacity: 0; } }
      @keyframes sp-letter { to { opacity: 1; transform: none; } }
      @keyframes sp-glow { to { opacity: 0.32; } }
      @keyframes sp-drift { to { translate: 4vmax 3vmax; } }

      /* ---- zoom (Command Center) ---- */
      .v-zoom { background: #111111; }
      .v-zoom svg { width: min(46vw, 340px); overflow: visible; opacity: 0; transform: scale(0.94); animation: sp-in 0.52s 0.08s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; will-change: transform, opacity; }
      @keyframes sp-in { to { opacity: 1; transform: scale(1); } }

      /* ---- caret ---- */
      .v-caret .half { position: absolute; left: 0; right: 0; height: 50.5%; background: #111111; }
      .v-caret .top { top: 0; } .v-caret .bot { bottom: 0; }
      .v-caret .line { position: relative; display: flex; align-items: center; font: 600 28px/1 ui-monospace, 'SF Mono', Menlo, monospace; letter-spacing: -0.02em; }
      .v-caret .line i { font-style: normal; display: inline-block; width: 0; overflow: hidden; vertical-align: bottom; animation: sp-type 0.01s steps(1) forwards; }
      .v-caret .cur { display: inline-block; width: 0.6em; height: 1.15em; margin-left: 2px; background: #FFE27A; border-radius: 2px; animation: sp-blink 0.75s steps(1) 1, sp-blink 1s 1.6s steps(1) infinite; }
      .v-caret .sp-sub { position: absolute; top: calc(50% + 38px); left: 0; right: 0; text-align: center; opacity: 0; animation: sp-fade 0.5s 1.55s ease forwards; }
      .v-caret .glowline { position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: #FFE27A; box-shadow: 0 0 18px 2px rgb(255 226 122 / 0.55); transform: scaleX(0); opacity: 0; }
      @keyframes sp-type { to { width: 1ch; } }


      /* ---- wink (after "Hey") ---- */
      .v-wink { background: #111111; transition: opacity 420ms cubic-bezier(0.16, 1, 0.3, 1), transform 520ms cubic-bezier(0.16, 1, 0.3, 1); }
      .v-wink.out { opacity: 0; transform: scale(1.05); }
      .v-wink .center { display: flex; flex-direction: column; align-items: center; gap: 28px; }
      .v-wink svg { width: 176px; height: 106px; overflow: visible; }
      .v-wink .word { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.045em; line-height: 1; white-space: nowrap; }
      .v-wink .word i { font-style: normal; display: inline-block; opacity: 0; transform: translateY(6px); animation: sp-letter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .v-wink .sp-sub { opacity: 0; animation: sp-fade 0.6s 1.65s ease forwards; }

      /* ---- haze (after "Brain Fog Haze") ---- */
      .v-haze { background: rgb(107, 107, 107); }
      .v-haze .center { display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .v-haze svg { width: min(92vw, 460px); overflow: visible; }
      .v-haze text { font: italic 800 92px/1 system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: -0.05em; }
      .v-haze .sp-sub { opacity: 0; }

      /* ---- assemble (after "WebGPU Type Explorations") ---- */
      .v-assemble { background: #111111; }
      .v-assemble .center { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .v-assemble .aword { display: flex; font: 900 60px/1 system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: -0.03em; white-space: nowrap; }
      .v-assemble .g { position: relative; display: inline-block; }
      .v-assemble .g.sp { width: 0.32em; }
      .v-assemble .sz { visibility: hidden; }
      .v-assemble .sl { position: absolute; left: 0; top: 0; will-change: transform; }
      .v-assemble .sl.r { color: #FF3355; mix-blend-mode: screen; }
      .v-assemble .sl.b { color: #3D7BFF; mix-blend-mode: screen; }
      .v-assemble .sl.w { color: #F5F5F5; }
      .v-assemble .g.y .sl.w { color: #FFE27A; }

      /* ---- morph (after "WebGPU Morphing Engine") ---- */
      .v-morph { background: #111111; }
      .v-morph .center { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .v-morph .mstage { position: relative; width: 300px; height: 150px; }
      .v-morph .mg, .v-morph .mp, .v-morph .mc { position: absolute; inset: 0; }
      .v-morph .mc { display: grid; place-items: center; font: 500 132px/1 system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: -0.06em; white-space: nowrap; }
      .v-morph .mc.w { color: #F5F5F5; }
      .v-morph .mc.o { color: #FF8A1F; mix-blend-mode: screen; }
      .v-morph .mc.b { color: #2E9BFF; mix-blend-mode: screen; }
      .v-morph .mc.w .u { color: #FFE27A; }
      .v-morph .mc .u { display: inline-block; transform: translateY(-0.08em); }
      .v-morph .mword { font: 700 30px/1 system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: -0.045em; }

      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash * * { animation: none !important; }
        .v-draw .up { transform: rotate(-32deg); } .v-draw .down { transform: rotate(32deg); }
        .v-draw .us { transform: none; } .v-draw .tip, .v-draw .sp-sub, .v-caret .sp-sub, .v-zoom svg { opacity: 1; transform: none; }
        .v-draw .word i { opacity: 1; transform: none; } .v-draw .glow { opacity: 0.32; } .v-caret .line i { width: 1ch; }
        .v-draw { transition: opacity 200ms ease; } #splash.out .v-draw { transform: none; filter: none; }
      }
    </style>
  </head>

    <script>
      (function () {
        var el = document.getElementById('splash'), v = 'draw';
        try {
          var q = new URLSearchParams(location.search).get('splash');
          if (/^(draw|zoom|caret|wink|haze|assemble|morph)$/.test(q || '')) v = q;
          // once per visit: a reload or a second tab goes straight in
          if (!q && sessionStorage.getItem('py-tutor.splash') === '1') { el.remove(); return; }
          sessionStorage.setItem('py-tutor.splash', '1');
        } catch (e) {}
        el.setAttribute('data-v', v);
        window.__splashAt = performance.now();
      })();
    </script>
    <script>
/* Start-up screen versions that need a script (wink, haze, assemble). Runs inline, right after the markup, so they
   start on the first frame, before the app's code loads.
   Each one sets window.__splashExit, which src/ui/splash.ts calls to play its exit; it returns the exit's length. */
(function () {
  var el = document.getElementById('splash');
  if (!el) return;
  var v = el.getAttribute('data-v');
  var reduce = false;
  try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  var NS = 'http://www.w3.org/2000/svg';
  var t0 = performance.now();
  var clamp = function (x) { return x < 0 ? 0 : x > 1 ? 1 : x; };
  var lerp = function (a, b, u) { return a + (b - a) * u; };
  var prog = function (t, a, b) { return clamp((t - a) / (b - a)); };
  var easeOut = function (u) { return 1 - Math.pow(1 - u, 3); };
  var easeInOut = function (u) { return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
  var backOut = function (u) { var c = 1.6, d = u - 1; return 1 + (c + 1) * d * d * d + c * d * d; };
  var mix = function (c1, c2, u) {
    return 'rgb(' + [0, 1, 2].map(function (i) { return Math.round(lerp(c1[i], c2[i], u)); }).join(',') + ')';
  };
  function loop(frame) {
    function tick() {
      if (!el.isConnected) return;
      frame((performance.now() - t0) / 1000);
      requestAnimationFrame(tick);
    }
    tick();
  }

  /* ---------- wink: a face winks, then its smile swings into the > and an eye drops into the _ ---------- */
  if (v === 'wink') {
    var box = el.querySelector('.v-wink');
    var svg = box.querySelector('svg');
    var mk = function (tag, attrs) {
      var n = document.createElementNS(NS, tag);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      svg.appendChild(n);
      return n;
    };
    var common = { fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
    var smile = mk('path', Object.assign({ 'stroke-width': 16, pathLength: 1 }, common));
    var eyeL = mk('line', Object.assign({}, common));
    var eyeR = mk('line', Object.assign({}, common));
    var N = 25, mid = 12;
    var face = [], chev = [];
    for (var i = 0; i < N; i++) {
      var u = i / (N - 1);
      // smile: a quadratic curve under the eyes
      face.push([lerp(lerp(46, 100, u), lerp(100, 154, u), u), lerp(lerp(74, 118, u), lerp(118, 74, u), u)]);
      // the >: top end -> tip -> bottom end (same as the logo: arms 84 long at 32 degrees, tip at 100,60)
      var a = i <= mid ? i / mid : (i - mid) / (N - 1 - mid);
      chev.push(i <= mid ? [lerp(28.8, 100, a), lerp(15.5, 60, a)] : [lerp(100, 28.8, a), lerp(60, 104.5, a)]);
    }
    var VIOLET = [196, 181, 253], INK = [245, 245, 245], YEL = [255, 226, 122];
    loop(function (t) {
      if (reduce) t = 9;
      var m = backOut(prog(t, 0.85, 1.4)); // the morph
      var mc = easeOut(prog(t, 0.85, 1.25)); // colour change
      var pts = face.map(function (p, i) { return [lerp(p[0], chev[i][0], m), lerp(p[1], chev[i][1], m)]; });
      smile.setAttribute('d', 'M' + pts.map(function (p) { return p[0].toFixed(2) + ' ' + p[1].toFixed(2); }).join('L'));
      smile.setAttribute('stroke', mix(VIOLET, INK, mc));
      var draw = easeOut(prog(t, 0.1, 0.5));
      if (draw < 1) smile.setAttribute('stroke-dasharray', draw + ' 1');
      else smile.removeAttribute('stroke-dasharray');
      smile.style.opacity = draw > 0 ? 1 : 0;
      // eyes pop in
      var pop = backOut(prog(t, 0.04, 0.3));
      var w16 = 16 * Math.max(0, pop);
      // left eye slides into the tip of the > and disappears into it
      var lx = lerp(72, 98, m), ly = lerp(36, 60, m);
      eyeL.setAttribute('x1', lx); eyeL.setAttribute('x2', lx); eyeL.setAttribute('y1', ly); eyeL.setAttribute('y2', ly);
      eyeL.setAttribute('stroke', mix(VIOLET, INK, mc));
      eyeL.setAttribute('stroke-width', w16 * (1 - prog(t, 1.15, 1.3)));
      // right eye winks, then drops and stretches into the _
      var wk = Math.sin(Math.PI * prog(t, 0.5, 0.78));

      eyeR.setAttribute('y1', cy); eyeR.setAttribute('y2', cy);

      eyeR.setAttribute('stroke', mix(VIOLET, YEL, mc));

    });
    window.__splashExit = function () {
      box.classList.add('out');
      return 600;
    };
  }

  /* ---------- haze: the word comes out of a blur into focus with a glowing rim; on exit it thins to an outline and smears away ---------- */
  if (v === 'haze') {
    var hbox = el.querySelector('.v-haze');
    var blur = hbox.querySelector('feGaussianBlur');
    var funcs = hbox.querySelectorAll('feFuncR, feFuncG, feFuncB');
    var turn = hbox.querySelector('.turn'), unturn = hbox.querySelector('.unturn');
    var sub = hbox.querySelector('.sp-sub');
    // tone curves: blurred letter coverage (0..1) -> brightness. The first value is always the background.
    var FOG = [0, 0.1, 0.22, 0.4, 0.55, 0.66, 0.74, 0.8, 0.84];
    var RIM = [0, 0, 0.08, 0.95, 1, 0.82, 0.7, 0.74, 0.8];
    var CRISP = [0, 0.9, 1, 1, 0.97, 0.95, 0.95, 0.96, 0.97];
    var LINE = [0, 0, 0, -0.8, 0, 0, 0, 0, 0]; // a dark contour, added to the background
    // keyframes: time, background, blur along, blur across, angle, curve mix [fog, rim, crisp, line]
    var IN = [
      [0.0, 0.42, 34, 3, -24, [1, 0, 0, 0]],
      [0.3, 0.2, 22, 3, -18, [0.6, 0.4, 0, 0]],
      [0.62, 0.075, 7, 2, -8, [0, 1, 0, 0]],
      [0.95, 0.067, 1.6, 1.2, -3, [0, 0.55, 0.45, 0]],
      [1.25, 0.067, 0.5, 0.5, 0, [0, 0, 1, 0]],
    ];
    var OUT = [
      [0.0, 0.067, 0.5, 0.5, 0, [0, 0, 1, 0]],
      [0.16, 0.6, 3, 1.5, 6, [0, 0.4, 0, 0.6]],
      [0.32, 0.86, 9, 2, 14, [0, 0, 0, 1]],
      [0.6, 0.9, 30, 3, 22, [0.5, 0, 0, 0.5]],
    ];
    var outAt = -1;
    var at = function (keys, t) {
      if (t <= keys[0][0]) return keys[0];
      for (var i = 1; i < keys.length; i++) {
        if (t <= keys[i][0]) {
          var a = keys[i - 1], b = keys[i], u = easeInOut((t - a[0]) / (b[0] - a[0]));
          return [t, lerp(a[1], b[1], u), lerp(a[2], b[2], u), lerp(a[3], b[3], u), lerp(a[4], b[4], u), a[5].map(function (x, j) { return lerp(x, b[5][j], u); })];
        }
      }
      return keys[keys.length - 1];
    };
    loop(function (t) {
      if (reduce) t = 9;
      var k = outAt >= 0 ? at(OUT, t - outAt) : at(IN, t);
      var bg = k[1], w = k[5];
      var table = FOG.map(function (_, i) {
        var y = lerp(bg, 1, w[0] * FOG[i] + w[1] * RIM[i] + w[2] * CRISP[i]);

      });

      var s = table.join(' ');
      for (var i = 0; i < funcs.length; i++) funcs[i].setAttribute('tableValues', s);
      blur.setAttribute('stdDeviation', k[2].toFixed(2) + ' ' + k[3].toFixed(2));
      turn.setAttribute('transform', 'rotate(' + k[4].toFixed(2) + ' 200 70)');
      unturn.setAttribute('transform', 'rotate(' + (-k[4]).toFixed(2) + ' 200 70)');
      var c = Math.round(bg * 255);
      hbox.style.backgroundColor = 'rgb(' + c + ',' + c + ',' + c + ')';
      sub.style.opacity = outAt >= 0 ? 0 : clamp((t - 1.15) / 0.4);
    });
    window.__splashExit = function () {
      outAt = (performance.now() - t0) / 1000;
      hbox.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, delay: 560, easing: 'ease-out', fill: 'forwards' });
      return 840;
    };
  }

  /* ---------- assemble: heavy letters built from slices that fly in on curves, with colour fringes ---------- */
  if (v === 'assemble') {
    var abox = el.querySelector('.v-assemble');
    var word = abox.querySelector('.aword');
    var text = word.getAttribute('data-text');
    var seed = 7;
    var rnd = function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    var K = 4; // slices per letter
    var slices = [];
    text.split('').forEach(function (ch, gi) {
      var g = document.createElement('span');
      g.className = 'g' + (ch === '_' ? ' y' : '') + (ch === ' ' ? ' sp' : '');
      var size = document.createElement('span');
      size.className = 'sz';
      size.textContent = ch === ' ' ? ' ' : ch;
      g.appendChild(size);
      if (ch !== ' ') {
        for (var s = 0; s < K; s++) {
          ['r', 'b', 'w'].forEach(function (col) {
            var sl = document.createElement('span');
            sl.className = 'sl ' + col;
            sl.textContent = ch;
            sl.style.clipPath = 'inset(' + (s * 100) / K + '% -20% ' + ((K - 1 - s) * 100) / K + '% -20%)';
            g.appendChild(sl);
            slices.push({ el: sl, gi: gi, s: s, col: col });
          });
        }
      }
      word.appendChild(g);
    });
    // one random path per slice, shared by its three colour copies
    var paths = {};
    slices.forEach(function (o) {
      var key = o.gi + ':' + o.s;
      if (!paths[key]) {
        paths[key] = {
          dx: 120 + rnd() * 220,
          dy: (o.s - 1.5) * (18 + rnd() * 30) + (rnd() - 0.5) * 40,
          r: (rnd() - 0.5) * 50,
          sx: 0.15 + rnd() * 0.3,
          d: 0.08 + o.gi * 0.065 + o.s * 0.025 + rnd() * 0.06,
        };
      }
      var p = paths[key];
      var lag = o.col === 'w' ? 0 : o.col === 'r' ? 0.035 : 0.07;
      if (reduce) return;
      o.el.animate(
        [
          { transform: 'translate(' + p.dx + 'px,' + p.dy + 'px) rotate(' + p.r + 'deg) scaleX(' + p.sx + ')', opacity: 0, offset: 0 },
          { opacity: 1, offset: 0.25 },
          { transform: 'translate(' + p.dx * 0.18 + 'px,' + p.dy * 0.05 + 'px) rotate(' + p.r * 0.1 + 'deg) scaleX(1.06)', offset: 0.7 },
          { transform: 'none', opacity: 1, offset: 1 },
        ],
        { duration: 720, delay: (p.d + lag) * 1000, easing: 'cubic-bezier(.2,.75,.25,1)', fill: 'backwards' },
      );
    });
    abox.querySelector('.sp-sub').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500, delay: reduce ? 0 : 1150, fill: 'backwards' });
    window.__splashExit = function () {
      slices.forEach(function (o) {
        var p = paths[o.gi + ':' + o.s];
        var lag = o.col === 'w' ? 0 : o.col === 'r' ? 0.03 : 0.06;
        o.el.animate(
          [{ transform: 'none', opacity: 1 }, { transform: 'translate(' + -p.dx * 1.2 + 'px,' + -p.dy * 0.6 + 'px) rotate(' + -p.r + 'deg) scaleX(' + p.sx + ')', opacity: 0 }],
          { duration: 460, delay: ((text.length - o.gi) * 0.03 + o.s * 0.015 + lag) * 1000, easing: 'cubic-bezier(.6,0,.8,.3)', fill: 'forwards' },
        );
      });
      abox.querySelector('.sp-sub').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' });
      abox.animate([{ backgroundColor: '#111111' }, { backgroundColor: 'rgba(17,17,17,0)' }], { duration: 380, delay: 420, easing: 'ease-in', fill: 'forwards' });
      return 860;
    };
  }
  /* ---------- morph (after "WebGPU Morphing Engine"): { } -> 19 -> >_, each melting into the next in pieces with colour fringes ---------- */
  if (v === 'morph') {
    var mbox = el.querySelector('.v-morph');
    var stage = mbox.querySelector('.mstage');
    var mseed = 11;
    var mr = function () { mseed = (mseed * 16807) % 2147483647; return (mseed - 1) / 2147483646; };
    var CUTS = [[0, -40, 100, -40, 100, 38, 0, 52], [0, 52, 100, 38, 100, 70, 0, 78], [0, 78, 100, 70, 100, 140, 0, 140]]; // three slanted bands
    var poly0 = function (c) { return 'polygon(-20% ' + (c[1] - 0.8) + '%,120% ' + (c[3] - 0.8) + '%,120% ' + (c[5] + 0.8) + '%,-20% ' + (c[7] + 0.8) + '%)'; };
    function glyph(html) {
      var g = document.createElement('div');
      g.className = 'mg';
      var pieces = CUTS.map(function (c, i) {
        var p = document.createElement('div');
        p.className = 'mp';
        p.style.clipPath = poly0(CUTS[i]);
        ['o', 'b', 'w'].forEach(function (col) {
          var s = document.createElement('div');
          s.className = 'mc ' + col;
          s.innerHTML = '<span>' + html + '</span>';
          p.appendChild(s);
        });
        g.appendChild(p);
        return { el: p, o: p.children[0], b: p.children[1], w: p.children[2], r: (mr() - 0.5) * 34, x: (mr() - 0.5) * 90, y: (i - 1) * 26 + (mr() - 0.5) * 30 };

    }
    var E_IN = 'cubic-bezier(.2,.8,.2,1)', E_OUT = 'cubic-bezier(.6,0,.8,.4)';
    function enter(pieces, at, dur) {
      pieces.forEach(function (p, i) {
        var d = (at + i * 0.04) * 1000;
        var from = 'translate(' + p.x + 'px,' + p.y + 'px) rotate(' + p.r + 'deg) scale(1.12)';
        p.el.animate([{ transform: from, opacity: 0, filter: 'blur(14px)' }, { opacity: 1, offset: 0.3 }, { transform: 'none', opacity: 1, filter: 'blur(0px)' }], { duration: dur * 1000, delay: d, easing: E_IN, fill: 'backwards' });
        // the colour edges: wide while it moves, settling to a hairline
        p.o.animate([{ transform: 'translate(-9px,3px) scale(1.06)', filter: 'blur(10px)', opacity: 1 }, { transform: 'translate(-1px,0) scale(1.005)', filter: 'blur(2px)', opacity: 0.55 }], { duration: dur * 1300, delay: d, easing: E_IN, fill: 'both' });
        p.b.animate([{ transform: 'translate(8px,-3px) scale(0.95)', filter: 'blur(8px)', opacity: 1 }, { transform: 'translate(1px,0) scale(0.995)', filter: 'blur(1.5px)', opacity: 0.5 }], { duration: dur * 1300, delay: d, easing: E_IN, fill: 'both' });
      });
    }
    function leave(pieces, at, dur) {
      pieces.forEach(function (p, i) {
        var d = (at + (2 - i) * 0.035) * 1000;

        p.el.animate([{ transform: 'none', opacity: 1, filter: 'blur(0px)' }, { opacity: 1, offset: 0.6 }, { transform: to, opacity: 0, filter: 'blur(14px)' }], { duration: dur * 1000, delay: d, easing: E_OUT, fill: 'forwards' });
        p.o.animate([{ transform: 'translate(-1px,0)', filter: 'blur(2px)', opacity: 0.55 }, { transform: 'translate(-10px,4px) scale(1.06)', filter: 'blur(10px)', opacity: 1 }], { duration: dur * 1000, delay: d, easing: E_OUT, fill: 'forwards' });
        p.b.animate([{ transform: 'translate(1px,0)', filter: 'blur(1.5px)', opacity: 0.5 }, { transform: 'translate(9px,-4px) scale(0.95)', filter: 'blur(8px)', opacity: 1 }], { duration: dur * 1000, delay: d, easing: E_OUT, fill: 'forwards' });
      });
    }
    var g1 = glyph('{&#8202;}'), g2 = glyph('19'), g3 = glyph('&gt;<span class="u">_</span>');
    var word = mbox.querySelector('.mword'), msub = mbox.querySelector('.sp-sub');
    if (reduce) {
      g1.concat(g2).forEach(function (p) { p.el.style.opacity = 0; });
    } else {
      enter(g1, 0.08, 0.5);
      leave(g1, 0.62, 0.42);
      enter(g2, 0.68, 0.5);
      leave(g2, 1.18, 0.42);
      enter(g3, 1.24, 0.55);
      word.animate([{ opacity: 0, filter: 'blur(8px)', transform: 'translateY(6px)' }, { opacity: 1, filter: 'blur(0px)', transform: 'none' }], { duration: 500, delay: 1.55 * 1000, easing: E_IN, fill: 'backwards' });

    }
    window.__splashExit = function () {
      leave(g3, 0, 0.5);
      [word, msub].forEach(function (n) { n.animate([{ opacity: 1, filter: 'blur(0px)' }, { opacity: 0, filter: 'blur(8px)' }], { duration: 300, fill: 'forwards' }); });
      mbox.animate([{ backgroundColor: '#111111' }, { backgroundColor: 'rgba(17,17,17,0)' }], { duration: 400, delay: 250, easing: 'ease-in', fill: 'forwards' });
      var root = document.getElementById('root');
      if (root) root.animate([{ filter: 'blur(10px)', transform: 'scale(1.04)', opacity: 0 }, { filter: 'blur(0px)', transform: 'none', opacity: 1 }], { duration: 600, delay: 250, easing: E_IN, fill: 'backwards' });

    };
  }
})();
